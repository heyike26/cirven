[project]
name = "eeas-external"
version = "0.1.0"
description = "Local engineering agent control plane"
requires-python = ">=3.10"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "psutil==7.2.2", "Pillow==12.3.0", "pypdf==6.12.0", "jsonschema==4.26.0", "mcp==2.3.0", "python-docx==1.2.0", "docxtpl==0.20.2", "Jinja2==3.1.6", "MarkupSafe==3.0.3", "lxml==6.0.2", "markdown-it-py==4.0.0", "mdurl==0.1.2"]

[project.optional-dependencies]
agent = ["claude-agent-sdk==0.2.165"]
test = ["pytest==9.1.1", "playwright==1.63.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
